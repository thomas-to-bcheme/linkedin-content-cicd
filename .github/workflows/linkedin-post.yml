name: Post to LinkedIn

on:
  schedule:
    - cron: '0 9 * * 1-5'
      timezone: 'America/Los_Angeles'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (posts to Connections only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/post-to-linkedin.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin/not-posted/ linkedin/posted/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            SLUG=$(cat linkedin/.post-queue.last 2>/dev/null || echo "unknown")
            git commit -m "Post: ${SLUG} to LinkedIn"
            git push
          fi